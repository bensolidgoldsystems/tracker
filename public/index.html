<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SGS Tracker</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080808">
<meta name="description" content="Solid Gold Systems internal website build tracker.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Solid Gold Systems">
<meta property="og:title" content="SGS Tracker">
<meta property="og:description" content="Solid Gold Systems internal website build tracker.">
<meta property="og:url" content="https://tracker.solidgoldsystems.com/">
<meta property="og:image" content="https://tracker.solidgoldsystems.com/og-tracker.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Solid Gold Systems Tracker">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tracker.solidgoldsystems.com/og-tracker.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/sgs.css">
<link rel="stylesheet" href="/assets/tracker.css">
</head>
<body>

<!-- Sign in -->
<div id="authView" class="auth hidden">
  <div class="auth-card">
    <img src="/assets/logo.png" alt="Solid Gold Systems" width="150" height="49">
    <h1>Tracker</h1>
    <form id="loginForm" novalidate>
      <div class="fld"><label for="loginEmail">Email</label><input class="inp" id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="fld"><label for="loginPass">Password</label><input class="inp" id="loginPass" type="password" autocomplete="current-password" required></div>
      <button class="btn gold" type="submit">Sign in</button>
      <button class="linkbtn" type="button" id="forgotBtn">Forgot password?</button>
    </form>
    <form id="resetForm" class="hidden" novalidate>
      <p class="auth-step" id="resetTitle">Choose a password</p>
      <p class="muted" id="resetSub">At least 8 characters.</p>
      <div class="fld"><label for="newPass">New password</label><input class="inp" id="newPass" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="fld"><label for="newPass2">Confirm password</label><input class="inp" id="newPass2" type="password" autocomplete="new-password" minlength="8" required></div>
      <button class="btn gold" type="submit">Save password</button>
    </form>

    <!-- 2FA: code emailed on each sign-in -->
    <form id="mfaForm" class="hidden" novalidate>
      <p class="auth-step">Check your email</p>
      <p class="muted" id="mfaSent">We emailed you a 6-digit code.</p>
      <div class="fld"><label for="mfaCode">6-digit code</label><input class="inp code" id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>
      <button class="btn gold" type="submit">Verify</button>
      <button class="linkbtn" type="button" id="resendCode">Send a new code</button>
    </form>

    <button class="linkbtn hidden" type="button" id="authCancel" style="display:block;margin:12px auto 0">Sign out</button>
    <p class="authmsg" id="authMsg" role="status"></p>
  </div>
</div>

<!-- App -->
<div id="appView" class="hidden">
  <header class="top">
    <a href="#" class="brand" aria-label="Tracker home"><img src="/assets/logo.png" alt="Solid Gold Systems" width="110" height="36"><span>Tracker</span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#overview" id="tabOverview" class="tab">Overview</a>
      <a href="#clients" id="tabClients" class="tab">Clients</a>
      <a href="#finance" id="tabReports" class="tab">Finance</a>
      <a href="#adleads" id="tabAdLeads" class="tab">Client Leads</a>
      <a href="#sgs" id="tabSgs" class="tab">SGS Leads</a>
      <a href="#ppl" id="tabPpl" class="tab">Pay per lead</a>
      <a href="#leads" id="tabLeads" class="tab">Website Leads</a>
    </nav>
    <div class="top-actions">
      <a class="btn sm hidden" id="adminLink" href="#admin">Admin</a>
      <a class="btn sm" id="settingsLink" href="#settings">Settings</a>
      <button class="btn sm ghost" id="signOut">Sign out</button>
    </div>
  </header>

  <section id="overviewView" class="hidden"></section>
  <section id="clientsView" class="hidden"></section>
  <section id="reportsView" class="hidden"></section>
  <section id="pplView" class="hidden"></section>
  <section id="adLeadsView" class="hidden"></section>
  <section id="sgsView" class="hidden"></section>
  <section id="boardView" class="hidden">
    <div class="board-bar">
      <input class="inp search" id="search" type="search" placeholder="Search business, name, email..." aria-label="Search leads">
      <button class="btn sm ghost" id="refresh">Refresh</button>
      <span class="spacer"></span>
      <button class="btn sm" id="copyIntake" title="Copy the website offer page (short form, then booking) to send to a new lead">Copy website link</button>
      <button class="btn sm" id="newLead">+ New lead</button>
    </div>
    <div class="board" id="board"></div>
  </section>

  <section id="leadView" class="hidden"></section>
  <section id="adminView" class="hidden"></section>
  <section id="settingsView" class="hidden"></section>
</div>

<div class="toast hidden" id="toast" role="status"></div>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>
<div class="viewer hidden" id="viewer" role="dialog" aria-modal="true" aria-label="File preview"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="/assets/config.js"></script>
<script src="/assets/schema.js"></script>
<script src="/assets/clients.js"></script>
<script src="/assets/reports.js"></script>
<script src="/assets/ppl.js"></script>
<script src="/assets/adleads.js"></script>
<script src="/assets/tracker.js"></script>
</body>
</html>
